<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EXE SNOWGLOBE · form&amp;soul.exe</title>
<style>
  @font-face { font-family: 'Quicksand'; font-weight: 700; src: url(fonts/quicksand-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Playfair Display'; font-weight: 700; src: url(fonts/playfair-display-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Cinzel'; font-weight: 700; src: url(fonts/cinzel-latin-700-normal.woff2) format('woff2'); }
  html, body { margin: 0; height: 100%; background: #0e131b; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="engine/snowglobe.js?v=1.1.0"></script>
<script>
  Promise.all(["700 30px 'Playfair Display'", "700 30px Cinzel", "700 30px Quicksand"].map(function (f) { return document.fonts.load(f); }))
    .then(function () { return SnowGlobe.create({ canvas: document.getElementById('c'), assets: 'assets/', config: { layout: new URLSearchParams(location.search).get('layout') === 'corner' ? 'corner' : 'full' } }); });
</script>
</body>
</html>
